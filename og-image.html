<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'OggLocal';
      src: url('portfolio-assets/oggtext-extrabolditalic-bf646c18fc22d99.otf') format('opentype');
      font-weight: 800;
      font-style: italic;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    .og {
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-columns: 1fr 440px;
      background: #ffffff;
    }
    .og-left {
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff;
    }
    .og-eyebrow {
      font-family: -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4E008E;
      opacity: 0.7;
    }
    .og-name {
      font-family: 'OggLocal', Georgia, serif;
      font-style: italic;
      font-weight: 800;
      font-size: 140px;
      letter-spacing: -0.03em;
      line-height: 0.92;
      color: #4E008E;
    }
    .og-tagline {
      font-family: -apple-system, sans-serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.6;
      color: #58534D;
      max-width: 480px;
    }
    .og-url {
      font-family: -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #aeaeb2;
      text-transform: uppercase;
    }
    .og-right {
      background: #4E008E;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .og-right::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
    }
    .og-right::after {
      content: '';
      position: absolute;
      inset: -20%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .og-flower {
      width: 182px;
      height: 182px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 16px 48px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="og-left">
      <span class="og-eyebrow">Portfolio</span>
      <div class="og-name">Todd<br>Wu</div>
      <p class="og-tagline">Designing for the craft.<br>Building for the people.</p>
      <span class="og-url">toddwu.com</span>
    </div>
    <div class="og-right">
      <img class="og-flower" src="portfolio-assets/purple-flower.png" alt="">
    </div>
  </div>
</body>
</html>
